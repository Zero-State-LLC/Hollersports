[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hollersports"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
torch = ["torch>=2.2"]
# Full research stack
research = ["scikit-learn>=1.4", "joblib>=1.3", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hollersports*"]

[tool.setuptools.package-data]
hollersports = ["sources/*.yaml", "sources/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["hollersports"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
